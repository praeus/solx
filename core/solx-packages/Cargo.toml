[package]
name = "solx-packages"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Install/uninstall solx packages by running their install.solx scripts and registering them."

[dependencies]
solx-surface = { workspace = true }
# `PackageActions` (see src/lib.rs).
async-trait = { workspace = true }
solx-config = { workspace = true }
solx-scripts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Downloading catalog packages from a GitHub release (see src/catalog.rs).
reqwest = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true }
tempfile = "3"
