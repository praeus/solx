[package]
name = "solx-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP server hosting the local solx managers, so multiple solx-cli/solx-mcp processes can share one appdata dir concurrently."

[[bin]]
name = "solx-server"
path = "src/main.rs"

[features]
# The token registry: client tokens, connect codes (`/auth/exchange`,
# `/connect`) and root-token-from-loopback-only. Implies the manager's
# feature, so the two can't get out of sync. Off, every bearer is the root
# token, as before.
default = ["registry", "tls"]
registry = ["solx-manager/registry", "solx-mcp/registry", "dep:solx-registry"]
# TLS serving (`server_tls`; see docs/tls-plan.md): from PEM files, from
# `<appdata>/certs` (`"auto"`), or on Windows from the certificate store.
# Plain HTTP stays available to loopback peers on the same port. Off, the
# server is plain HTTP only and `server_tls` other than "off" is an error.
tls = [
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:tokio-rustls",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tower-service",
    "dep:solx-certs",
    "dep:chrono",
    "dep:rustls-cng",
]

[dependencies]
solx-manager = { workspace = true, default-features = false, features = ["local"] }
solx-registry = { workspace = true, optional = true }
solx-surface = { workspace = true }
solx-config = { workspace = true }
# For `set_long_lived_host` and the scope checks (`ScopeCheck`) — everything
# else about action execution stays behind `solx-manager`'s `App`/`Solx`
# facade.
solx-actions = { workspace = true }
# `normalize_rel_path`: a file's scope is checked against the path the store
# will really use. `WEB_UI_DIR`, the store directory `GET /ui/*` serves.
solx-files = { workspace = true }
# `streamable_http_service()` — mounts the same `SolxMcpServer` the stdio
# `solx-mcp` binary uses, as an MCP-over-HTTP route sharing this process's
# `Arc<App>`. See routes/mcp.rs.
solx-mcp = { workspace = true, default-features = false }
axum = { workspace = true }
axum-extra = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { workspace = true }
serde = { workspace = true }
# Content-Type for `GET /files/{*rel_path}`, guessed from the extension —
# the `FileStore` trait doesn't persist one.
mime_guess = { workspace = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
# Only `TlsState`, to read what `<appdata>/certs/tls.json` records for
# `server_tls: "auto"`.
solx-certs = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
rustls-cng = { workspace = true, optional = true }

[dev-dependencies]
# For the principal-propagation tests (`solx_actions::test_probe`).
solx-actions = { workspace = true, features = ["test-probe"] }
reqwest = { workspace = true }
solx-client = { workspace = true }
tempfile = "3"
# MCP client, for the /mcp Streamable HTTP integration test only — not part
# of the shipped `solx-server` binary (which only needs `solx-mcp`'s server
# side, pulled in as a normal dependency above).
rmcp = { version = "3.0.0", features = ["client", "transport-streamable-http-client-reqwest"] }
# TLS tests: a file-backend CA and server certificate in a tempdir.
solx-certs = { workspace = true }
