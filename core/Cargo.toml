[workspace]
members = [
    "solx-surface",
    "solx-config",
    "solx-types",
    "solx-files",
    "solx-docs",
    "solx-console",
    "solx-actions",
    "solx-registry",
    "solx-certs",
    "solx-scripts",
    "solx-packages",
    "solx-manager",
    "solx-cli",
    "solx-mcp",
    "solx-client",
    "solx-server",
    "solx-tauri-plugin",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Foundation (dependency-light) — kept in sync across crates.
serde       = { version = "1", features = ["derive"] }
serde_json  = { version = "1", features = ["preserve_order"] }
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
thiserror   = "1"
async-trait = "0.1"
schemars    = { version = "0.8", features = ["uuid1", "chrono", "preserve_order"] }

# Runtime / backend (only pulled in by impl crates, never by solx-surface).
tokio      = { version = "1", features = ["full"] }
libsql     = "0.10"
jsonschema = { version = "0.28", default-features = false }
base64     = "0.22"
mime_guess = "2"
anyhow     = "1"
clap       = { version = "4.5", features = ["derive"] }
fs2        = "0.4"
# `rustls-tls-native-roots`: solx clients also trust the OS trust store, so
# an imported solx root works (solx-client's `http_client`).
reqwest    = { version = "0.12", features = ["json", "rustls-tls", "rustls-tls-native-roots", "stream"] }
url        = "2"
rand       = "0.8"
tracing    = "0.1"
axum       = "0.7"
http       = "1"
# Query extractor that accepts repeated keys (`?excludePaths=/a&excludePaths=/b`),
# which `axum::extract::Query` (serde_urlencoded) rejects as a duplicate field.
axum-extra = { version = "0.9", default-features = false, features = ["query"] }
serde_html_form = "0.2"
tower-http = { version = "0.5", features = ["cors"] }
futures    = "0.3"

# TLS and certificates (solx-certs; see docs/tls-plan.md). rustls with the
# `ring` provider, as reqwest's `rustls-tls` already uses, so the Windows
# build needs no cmake/NASM for aws-lc.
rcgen      = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls     = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
time       = "0.3"
sha2       = "0.10"
aes-gcm    = "0.10"
# Interface addresses, for the SANs of a server bound on 0.0.0.0/::.
if-addrs   = "0.15"
# Serving TLS (solx-server's `tls` feature): a hand-rolled accept loop that
# sniffs TLS from plain HTTP, since axum 0.7's `serve` takes no TLS
# listener. `rustls-cng` serves a certificate whose key stays in the Windows
# store; its default aws-lc provider is off, since it only needs rustls' traits.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper      = "1"
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio"] }
tower-service = "0.3"
rustls-cng = { version = "0.7", default-features = false, features = ["tls12"] }

# Local crates
solx-surface  = { path = "solx-surface" }
solx-config   = { path = "solx-config" }
solx-types    = { path = "solx-types" }
solx-files    = { path = "solx-files" }
solx-docs     = { path = "solx-docs" }
solx-console  = { path = "solx-console" }
solx-actions  = { path = "solx-actions" }
solx-registry = { path = "solx-registry" }
solx-certs    = { path = "solx-certs" }
solx-scripts  = { path = "solx-scripts" }
solx-packages = { path = "solx-packages" }
# default-features off for the crates with a `registry` feature, so a member
# can really turn it off; each dependent forwards its own default-on feature.
solx-manager  = { path = "solx-manager", default-features = false }
solx-cli      = { path = "solx-cli", default-features = false }
solx-client   = { path = "solx-client" }
solx-mcp      = { path = "solx-mcp", default-features = false }
solx-server   = { path = "solx-server", default-features = false }
solx-tauri-plugin = { path = "solx-tauri-plugin" }
