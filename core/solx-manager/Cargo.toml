[package]
name = "solx-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wires the solx manager implementations together (local or remote, the App/Solx assembly), shared by solx-cli, solx-mcp, and solx-server."

[features]
# `local` pulls in the in-process manager implementations (and with them
# wasmtime, libsql, keyring, ...). Without it, `App` can only proxy to a
# remote `solx-server` via `solx-client` — what a thin client (e.g. the
# Tauri client build) wants.
default = ["local", "registry"]
local = ["dep:solx-types", "dep:solx-files", "dep:solx-docs", "dep:solx-actions"]
# The token registry (`solx-registry`): scoped, expiring client and action
# tokens and connect codes instead of one shared root token. Without it,
# every bearer is the root token, as before. Hosts that depend on this crate
# with `default-features = false` must enable it themselves.
registry = ["local", "dep:solx-registry"]

[dependencies]
solx-surface = { workspace = true }
solx-config = { workspace = true }
solx-types = { workspace = true, optional = true }
solx-files = { workspace = true, optional = true }
solx-docs = { workspace = true, optional = true }
solx-actions = { workspace = true, optional = true }
solx-registry = { workspace = true, optional = true }
solx-client = { workspace = true }
# Only for `build_or_attach`'s `/health` probe; solx-client already links it.
reqwest = { workspace = true }
anyhow = { workspace = true }
