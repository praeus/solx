[package]
name = "solx-actions"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Action store for solx: own database, execution (command/webhook/internal/WASM), file refs."

[dependencies]
solx-surface = { workspace = true }
solx-config = { workspace = true }
solx-console = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
libsql = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
# Without a platform feature, keyring 3.x silently falls back to an
# in-memory mock store (writes vanish once the process exits) rather than
# erroring — enable all three native backends unconditionally, matching
# the crate's own docs.rs cross-platform build config; Cargo only pulls in
# each backend's deps on its matching `target_os`.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent"] }
aes-gcm = "0.10"
axum = { workspace = true }
jsonwebtoken = "9"
anyhow = { workspace = true }
solx-files = { workspace = true }
# SHA-256 of a locked action's artifact (see `src/lock.rs`).
sha2 = { workspace = true }
solx-scripts = { workspace = true }
wasmtime = { version = "47", features = ["component-model"] }
wasmtime-wasi = "47"
# For `FutureExt::catch_unwind` around guest execution — `spawn_blocking`
# used to absorb panics via JoinError and no longer does. Already in the
# tree via wasmtime's default `component-model-async` feature.
futures = { workspace = true }

# `open-url` launches the browser with `ShellExecuteW` rather than
# `cmd /C start`, which splits an unquoted URL at `&` (see
# `internal/open_url.rs`). Already in the tree via tokio/keyring.
[target.'cfg(windows)'.dependencies]
# `Win32_System_JobObjects` (+ `Win32_Security`, `Win32_System_Threading`
# for its signatures): the Job Object a background
# command runs in, so stopping it takes its whole process tree (see
# `background/contain.rs`).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# `killpg` for a background command's process group.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The fake background `tests/background.rs` drives. Needs `test-probe`,
# which only this crate's own dev-dependency on itself enables, so no
# shipped build includes it.
[[bin]]
name = "solx-fake-background"
path = "tests/fixtures/fake_background.rs"
required-features = ["test-probe"]
test = false

[features]
# Registers `test_probe`'s principal-echo handler. Enabled only from
# dependents' `[dev-dependencies]`, never by a shipped binary.
test-probe = []

[dev-dependencies]
solx-types = { workspace = true }
solx-docs = { workspace = true }
# Action tokens issued by the real registry (`tests/command_credentials.rs`).
solx-registry = { workspace = true }
tempfile = "3"
serial_test = "3"
# Seeds the principal probe for the integration tests (`tests/scope.rs`),
# which see this crate built without `cfg(test)`.
solx-actions = { path = ".", features = ["test-probe"] }
