[package]
name = "solx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "solx command-line interface."

[lib]
name = "solx_cli"
path = "src/lib.rs"

[[bin]]
name = "solx"
path = "src/main.rs"

[features]
# The token registry; see solx-manager's and solx-server's `registry`.
default = ["registry"]
registry = ["solx-manager/registry", "solx-server/registry"]

[dependencies]
solx-surface = { workspace = true }
solx-config = { workspace = true }
solx-actions = { workspace = true }
solx-scripts = { workspace = true }
solx-packages = { workspace = true }
solx-manager = { workspace = true, default-features = false, features = ["local"] }
solx-server = { workspace = true, default-features = false }
# `solx connect` redeems connect codes at `/auth/exchange`.
solx-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
