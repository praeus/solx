[package]
name = "solx-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP proxy implementations of the solx-surface manager traits, talking to a solx-server."

[dependencies]
solx-surface = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
# Percent-encoding entity references into request URLs, per path segment.
url = { workspace = true }
serde_html_form = { workspace = true }
tracing = { workspace = true }
# A pinned server's certificate verifier (`tls.rs`), on the same rustls
# reqwest uses; the pin is a base64url SHA-256.
rustls = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = "3"
