[package]
name = "solx-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP (Model Context Protocol) server exposing solx documents, types, files, and actions as tools to LLM clients over stdio or Streamable HTTP."

[lib]
name = "solx_mcp"
path = "src/lib.rs"

[[bin]]
name = "solx-mcp"
path = "src/main.rs"

[features]
# The token registry; see solx-manager's `registry` feature.
default = ["registry"]
registry = ["solx-manager/registry"]

[dependencies]
solx-manager = { workspace = true, default-features = false, features = ["local"] }
solx-surface = { workspace = true }
solx-config = { workspace = true }
# Only for `set_long_lived_host` — everything else about action execution
# stays behind `solx-manager`'s `App`/`Solx` facade.
solx-actions = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# "transport-io" backs the stdio binary; "transport-streamable-http-server"
# backs `streamable_http_service()`, which `solx-server` mounts as an HTTP
# route sharing the same `SolxMcpServer`/`Arc<App>` — see solx-server/Cargo.toml.
rmcp = { version = "3.0.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
# Only to name `http::request::Parts`, which the streamable HTTP transport
# puts in `RequestContext::extensions` — how `call_tool` reaches the
# `Principal` that `solx-server`'s `require_bearer` stored on the request.
http = { workspace = true }

[dev-dependencies]
tempfile = "3"
# For the stdio principal test (`solx_actions::test_probe`).
solx-actions = { workspace = true, features = ["test-probe"] }
# Extra features for the in-process client/server integration test only —
# additive on top of the binary's own "server"/"transport-io" features for
# `cargo test`, not part of the shipped `solx-mcp` binary.
rmcp = { version = "3.0.0", features = ["client"] }
# Test-only, to register a Script action's artifact directly against the
# concrete `App`/`ActionManager` (bypassing the MCP tool layer, exactly like
# `solx-actions`'s own unit tests do) rather than duplicating its file-path
# convention as a string literal.
solx-files = { workspace = true }
